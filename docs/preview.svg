<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#162032"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a273f"/>
      <stop offset="100%" stop-color="#121b2d"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="520" rx="16" fill="none" stroke="#2a3a54" stroke-width="2"/>

  <!-- Topbar -->
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="#0f172a" fill-opacity="0.85"/>
  <line x1="0" y1="64" x2="1000" y2="64" stroke="#2a3a54" stroke-width="1.5"/>

  <!-- Logo & Title -->
  <rect x="24" y="16" width="36" height="36" rx="8" fill="#1e3a8a"/>
  <text x="32" y="40" font-size="20">📸</text>
  <text x="70" y="34" fill="#f8fafc" font-size="16" font-weight="700">Google Takeout ➔ iCloud Studio</text>
  <text x="70" y="50" fill="#94a3b8" font-size="11.5">Zero-Deletions Read-Only Engine · Direct NAS Zip Scanning · Automatic EXIF &amp; H.264</text>

  <!-- Status Badges -->
  <rect x="740" y="20" width="125" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="752" y="37" fill="#34d399" font-size="11" font-weight="600">✓ ExifTool Active</text>
  <rect x="875" y="20" width="100" height="26" rx="13" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="888" y="37" fill="#60a5fa" font-size="11" font-weight="600">🔒 100% Local</text>

  <!-- KPI Cards (Row 1) -->
  <!-- Card 1 -->
  <g transform="translate(24, 82)">
    <rect width="175" height="84" rx="10" fill="url(#cardGrad)" stroke="#2a3a54" stroke-width="1" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#94a3b8" font-size="10.5" font-weight="600" letter-spacing="0.5">1. CURRENT ICLOUD</text>
    <text x="14" y="54" fill="#f8fafc" font-size="24" font-weight="800">41,915</text>
    <text x="14" y="72" fill="#64748b" font-size="10.5">38,408 photos · 3,507 videos</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(217, 82)">
    <rect width="175" height="84" rx="10" fill="url(#cardGrad)" stroke="#2a3a54" stroke-width="1" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#94a3b8" font-size="10.5" font-weight="600" letter-spacing="0.5">2. TAKEOUT &amp; FOLDERS</text>
    <text x="14" y="54" fill="#f8fafc" font-size="24" font-weight="800">10,069</text>
    <text x="14" y="72" fill="#64748b" font-size="10.5">20 archives on NAS (200 GB)</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(410, 82)">
    <rect width="175" height="84" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#34d399" font-size="10.5" font-weight="600" letter-spacing="0.5">ALREADY IN ICLOUD</text>
    <text x="14" y="54" fill="#f8fafc" font-size="24" font-weight="800">5,298</text>
    <text x="14" y="72" fill="#10b981" font-size="10.5">Filtered out to prevent duplicates</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(603, 82)">
    <rect width="175" height="84" rx="10" fill="#251624" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#fb7185" font-size="10.5" font-weight="700" letter-spacing="0.5">MISSING IN ICLOUD</text>
    <text x="14" y="54" fill="#f43f5e" font-size="24" font-weight="800">3,100</text>
    <text x="14" y="72" fill="#fda4af" font-size="10.5">Detected &amp; Ready to Import</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(796, 82)">
    <rect width="180" height="84" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#60a5fa" font-size="10.5" font-weight="600" letter-spacing="0.5">IMPORTED TO PHOTOS</text>
    <text x="14" y="54" fill="#38bdf8" font-size="24" font-weight="800">1,671</text>
    <text x="14" y="72" fill="#93c5fd" font-size="10.5">Verified in Albums with dates</text>
  </g>

  <!-- Three Columns Layout (Row 2) -->
  <!-- Step 1 -->
  <g transform="translate(24, 182)">
    <rect width="296" height="136" rx="12" fill="#162032" stroke="#2a3a54" stroke-width="1"/>
    <rect x="14" y="14" width="115" height="18" rx="9" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="22" y="27" fill="#60a5fa" font-size="9.5" font-weight="700">STEP 1 · ICLOUD</text>
    <text x="14" y="50" fill="#f8fafc" font-size="14" font-weight="700">macOS Photos Library</text>
    <text x="14" y="68" fill="#94a3b8" font-size="11">Reads local cache without downloading</text>
    <text x="14" y="82" fill="#94a3b8" font-size="11">40k+ cloud assets. Zero network cost.</text>
    <rect x="14" y="96" width="160" height="28" rx="6" fill="#2563eb"/>
    <text x="24" y="114" fill="#ffffff" font-size="11" font-weight="600">⚡ Scan iCloud Library</text>
  </g>

  <!-- Step 2A -->
  <g transform="translate(336, 182)">
    <rect width="324" height="136" rx="12" fill="#162032" stroke="#2a3a54" stroke-width="1"/>
    <rect x="14" y="14" width="130" height="18" rx="9" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="22" y="27" fill="#fbbf24" font-size="9.5" font-weight="700">STEP 2A · TAKE-OUT ZIPS</text>
    <text x="14" y="50" fill="#f8fafc" font-size="14" font-weight="700">Google Takeout Archives</text>
    <text x="14" y="68" fill="#94a3b8" font-size="11">Scans 20x 10GB ZIPs from NAS via SMB</text>
    <text x="14" y="82" fill="#94a3b8" font-size="11">without extracting 200 GB to Mac disk.</text>
    <rect x="14" y="96" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="114" fill="#f8fafc" font-size="11" font-weight="600">📄 Choose .ZIPs / NAS</text>
  </g>

  <!-- Step 2B -->
  <g transform="translate(676, 182)">
    <rect width="300" height="136" rx="12" fill="#162032" stroke="#2a3a54" stroke-width="1"/>
    <rect x="14" y="14" width="135" height="18" rx="9" fill="#10b981" fill-opacity="0.15"/>
    <text x="22" y="27" fill="#34d399" font-size="9.5" font-weight="700">STEP 2B · LOOSE FOLDERS</text>
    <text x="14" y="50" fill="#f8fafc" font-size="14" font-weight="700">Uncompressed Media</text>
    <text x="14" y="68" fill="#94a3b8" font-size="11">Imports folders with EXIF/QuickTime</text>
    <text x="14" y="82" fill="#94a3b8" font-size="11">dates restored. Fixes WhatsApp dates.</text>
    <rect x="14" y="96" width="140" height="28" rx="6" fill="#059669"/>
    <text x="24" y="114" fill="#ffffff" font-size="11" font-weight="600">➕ Add Loose Folder</text>
  </g>

  <!-- Heatmap Year/Month Table Mockup (Row 3) -->
  <g transform="translate(24, 332)">
    <rect width="952" height="168" rx="12" fill="#121b2d" stroke="#2a3a54" stroke-width="1"/>
    <!-- Header -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 940 0 C 946.63 0 952 5.37 952 12 L 952 40 L 0 40 Z" fill="#1a273f"/>
    <text x="18" y="26" fill="#f8fafc" font-size="13" font-weight="700">📅 Year &amp; Month Comparison Matrix</text>
    <text x="320" y="25" fill="#94a3b8" font-size="11">Status in iCloud</text>
    <text x="490" y="25" fill="#94a3b8" font-size="11">In iCloud</text>
    <text x="600" y="25" fill="#94a3b8" font-size="11">In Takeout</text>
    <text x="700" y="25" fill="#94a3b8" font-size="11">Missing to Upload</text>
    <text x="860" y="25" fill="#94a3b8" font-size="11">Actions</text>

    <!-- Row 1 -->
    <line x1="0" y1="40" x2="952" y2="40" stroke="#2a3a54" stroke-width="1"/>
    <text x="18" y="67" fill="#f8fafc" font-size="12" font-weight="600">2022-08 (August)</text>
    <rect x="315" y="55" width="125" height="18" rx="4" fill="#fbbf24" fill-opacity="0.15"/>
    <text x="322" y="68" fill="#fcd34d" font-size="10.5" font-weight="600">🟡 Partial (9 missing)</text>
    <text x="495" y="67" fill="#94a3b8" font-size="12">593 items</text>
    <text x="605" y="67" fill="#94a3b8" font-size="12">9 items</text>
    <text x="705" y="67" fill="#fb7185" font-size="12" font-weight="700">9 (5📷 / 4🎬 · 43.7 MB)</text>
    <rect x="850" y="52" width="85" height="24" rx="5" fill="#10b981"/>
    <text x="862" y="68" fill="#ffffff" font-size="10.5" font-weight="600">🚀 Upload Month</text>

    <!-- Row 2 -->
    <line x1="0" y1="82" x2="952" y2="82" stroke="#1f2c42" stroke-width="1"/>
    <text x="18" y="108" fill="#f8fafc" font-size="12" font-weight="600">2022-06 (June)</text>
    <rect x="315" y="96" width="145" height="18" rx="4" fill="#f43f5e" fill-opacity="0.15"/>
    <text x="322" y="109" fill="#fda4af" font-size="10.5" font-weight="600">🔴 Empty month in iCloud</text>
    <text x="495" y="108" fill="#94a3b8" font-size="12">0 items</text>
    <text x="605" y="108" fill="#94a3b8" font-size="12">8 items</text>
    <text x="705" y="108" fill="#fb7185" font-size="12" font-weight="700">8 (8📷 / 0🎬 · 1.7 MB)</text>
    <rect x="850" y="93" width="85" height="24" rx="5" fill="#10b981"/>
    <text x="862" y="109" fill="#ffffff" font-size="10.5" font-weight="600">🚀 Upload Month</text>

    <!-- Row 3 -->
    <line x1="0" y1="123" x2="952" y2="123" stroke="#1f2c42" stroke-width="1"/>
    <text x="18" y="149" fill="#f8fafc" font-size="12" font-weight="600">2022-09 (September)</text>
    <rect x="315" y="137" width="115" height="18" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="322" y="150" fill="#34d399" font-size="10.5" font-weight="600">✓ Up to date in iCloud</text>
    <text x="495" y="149" fill="#94a3b8" font-size="12">1,271 items</text>
    <text x="605" y="149" fill="#94a3b8" font-size="12">62 items</text>
    <text x="705" y="149" fill="#34d399" font-size="12" font-weight="600">0 (61 matched, 1 done)</text>
    <rect x="850" y="134" width="85" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="866" y="150" fill="#94a3b8" font-size="10.5" font-weight="600">✓ In Sync</text>
  </g>
</svg>
